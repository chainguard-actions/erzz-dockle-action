name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pull hello-world image
        run: docker pull hello-world

      - id: action
        uses: .
        with:
          image: hello-world
          exit-code: "0"
          failure-threshold: FATAL
          report-format: json
          report-name: dockle-report

      - name: Assert report file was created
        run: |
          if [ ! -f "dockle-report.json" ]; then
            echo "FAIL: expected dockle-report.json to exist"
            exit 1
          fi
          echo "PASS: dockle-report.json exists"

      - name: Assert report file is valid JSON
        run: |
          if ! cat dockle-report.json | python3 -m json.tool > /dev/null 2>&1; then
            echo "FAIL: dockle-report.json is not valid JSON"
            cat dockle-report.json
            exit 1
          fi
          echo "PASS: dockle-report.json is valid JSON"
