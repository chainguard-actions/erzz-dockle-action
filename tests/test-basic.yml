name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pull test image
        run: docker pull hello-world:latest

      - id: action
        uses: .
        with:
          image: hello-world:latest
          exit-code: "0"
          failure-threshold: "FATAL"

      - name: Assert dockle report file was created
        run: |
          echo "Checking for dockle-report.json..."
          if [ ! -f "dockle-report.json" ]; then
            echo "FAIL: dockle-report.json was not created"
            exit 1
          fi
          echo "PASS: dockle-report.json exists"
          cat dockle-report.json
