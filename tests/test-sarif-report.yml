name: Test SARIF report format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pull hello-world image
        run: docker pull hello-world

      - id: action
        uses: .
        with:
          image: hello-world
          report-format: sarif
          report-name: dockle-sarif-report
          exit-code: "0"
          failure-threshold: FATAL

      - name: Assert SARIF report file was created
        run: |
          if [ ! -f "dockle-sarif-report.sarif" ]; then
            echo "FAIL: expected dockle-sarif-report.sarif to exist"
            exit 1
          fi
          echo "PASS: dockle-sarif-report.sarif exists"

      - name: Assert SARIF report contains expected schema
        run: |
          CONTENT=$(cat dockle-sarif-report.sarif)
          echo "content preview: ${CONTENT:0:200}"
          if ! echo "$CONTENT" | grep -q "sarif"; then
            echo "FAIL: SARIF report does not appear to contain sarif content"
            exit 1
          fi
          echo "PASS: SARIF report contains expected content"
