name: Test custom report name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pull test image
        run: docker pull alpine:latest

      - id: action
        uses: .
        with:
          image: alpine:latest
          exit-code: "0"
          report-format: json
          report-name: my-custom-report
          failure-threshold: FATAL

      - name: Assert custom-named report file was created
        run: |
          echo "Checking for my-custom-report.json..."
          if [ ! -f "my-custom-report.json" ]; then
            echo "FAIL: my-custom-report.json was not created"
            exit 1
          fi
          echo "PASS: my-custom-report.json exists"

      - name: Assert default report name was NOT created
        run: |
          echo "Checking that dockle-report.json was NOT created..."
          if [ -f "dockle-report.json" ]; then
            echo "FAIL: dockle-report.json should not exist when custom name is used"
            exit 1
          fi
          echo "PASS: dockle-report.json correctly absent"
