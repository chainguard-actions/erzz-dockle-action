name: Test custom report name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Pull test image
        run: docker pull alpine:3.18
      - id: action
        uses: .
        with:
          image: alpine:3.18
          report-name: my-custom-report
          report-format: json
          exit-code: "0"
          failure-threshold: FATAL
      - name: Assert custom report file was created
        run: |
          echo "Checking for my-custom-report.json..."
          if [ ! -f "my-custom-report.json" ]; then
            echo "FAIL: expected my-custom-report.json to exist"
            exit 1
          fi
          echo "PASS: my-custom-report.json exists"
      - name: Assert custom report is valid JSON
        run: |
          echo "Validating JSON content..."
          if ! python3 -c "import json,sys; json.load(open('my-custom-report.json'))" 2>&1; then
            echo "FAIL: my-custom-report.json is not valid JSON"
            exit 1
          fi
          echo "PASS: my-custom-report.json is valid JSON"
