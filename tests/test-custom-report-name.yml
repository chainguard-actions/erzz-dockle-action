name: Test custom report name and INFO threshold
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pull test image
        run: docker pull hello-world

      - id: action
        uses: .
        with:
          image: hello-world
          report-format: json
          report-name: my-custom-report
          failure-threshold: INFO
          exit-code: "0"

      - name: Assert custom-named report file was created
        run: |
          echo "Checking for my-custom-report.json..."
          if [ ! -f "my-custom-report.json" ]; then
            echo "FAIL: my-custom-report.json was not created"
            ls -la *.json 2>/dev/null || echo "No JSON files found"
            exit 1
          fi
          echo "PASS: my-custom-report.json exists"

      - name: Assert report file is valid JSON
        run: |
          echo "Validating JSON content..."
          if ! python3 -m json.tool my-custom-report.json > /dev/null 2>&1; then
            echo "FAIL: my-custom-report.json is not valid JSON"
            cat my-custom-report.json
            exit 1
          fi
          echo "PASS: my-custom-report.json is valid JSON"
