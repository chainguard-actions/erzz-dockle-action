name: Test SARIF format output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pull test image
        run: docker pull hello-world

      - id: action
        uses: .
        with:
          image: hello-world
          report-format: sarif
          report-name: dockle-sarif-report
          failure-threshold: FATAL
          exit-code: "0"

      - name: Assert SARIF report file was created
        run: |
          echo "Checking for dockle-sarif-report.sarif..."
          if [ ! -f "dockle-sarif-report.sarif" ]; then
            echo "FAIL: dockle-sarif-report.sarif was not created"
            exit 1
          fi
          echo "PASS: dockle-sarif-report.sarif exists"

      - name: Assert SARIF report is valid JSON
        run: |
          echo "Validating SARIF content as JSON..."
          if ! python3 -c "import json,sys; data=json.load(open('dockle-sarif-report.sarif')); print('schema:', data.get('\$schema','N/A'))" 2>/dev/null; then
            echo "FAIL: dockle-sarif-report.sarif is not valid JSON/SARIF"
            cat dockle-sarif-report.sarif || true
            exit 1
          fi
          echo "PASS: dockle-sarif-report.sarif is valid JSON"
