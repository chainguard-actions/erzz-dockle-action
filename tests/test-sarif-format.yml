name: Test SARIF report format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Pull test image
        run: docker pull alpine:3.18
      - id: action
        uses: .
        with:
          image: alpine:3.18
          report-format: sarif
          report-name: dockle-sarif-report
          exit-code: "0"
          failure-threshold: FATAL
      - name: Assert SARIF report file was created
        run: |
          echo "Checking for dockle-sarif-report.sarif..."
          if [ ! -f "dockle-sarif-report.sarif" ]; then
            echo "FAIL: expected dockle-sarif-report.sarif to exist"
            exit 1
          fi
          echo "PASS: dockle-sarif-report.sarif exists"
      - name: Assert SARIF report is valid JSON (SARIF is JSON-based)
        run: |
          echo "Validating SARIF content as JSON..."
          if ! python3 -c "import json,sys; data=json.load(open('dockle-sarif-report.sarif')); print('schema:', data.get('\$schema','N/A'))" 2>&1; then
            echo "FAIL: dockle-sarif-report.sarif is not valid JSON/SARIF"
            exit 1
          fi
          echo "PASS: dockle-sarif-report.sarif is valid JSON"
