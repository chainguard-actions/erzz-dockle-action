name: Test no-fail mode (exit-code=0)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Pull test image
        run: docker pull alpine:3.18
      - id: action
        uses: .
        with:
          image: alpine:3.18
          exit-code: "0"
          failure-threshold: INFO
      - name: Assert action completed without failure
        run: |
          echo "PASS: action completed with exit-code=0 (no-fail mode)"
      - name: Assert report file was created
        run: |
          echo "Checking for dockle-report.json..."
          if [ ! -f "dockle-report.json" ]; then
            echo "FAIL: expected dockle-report.json to exist"
            exit 1
          fi
          echo "PASS: dockle-report.json exists"
