name: Test specific dockle version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Pull test image
        run: docker pull alpine:3.18
      - id: action
        uses: .
        with:
          image: alpine:3.18
          dockle-version: "0.4.14"
          exit-code: "0"
          failure-threshold: FATAL
      - name: Assert dockle binary is available and correct version
        run: |
          echo "Checking dockle version..."
          VERSION=$(dockle --version 2>&1 || true)
          echo "dockle version output: $VERSION"
          if echo "$VERSION" | grep -q "0.4.14"; then
            echo "PASS: dockle version 0.4.14 is installed"
          else
            echo "FAIL: expected dockle version 0.4.14, got: $VERSION"
            exit 1
          fi
      - name: Assert report file was created
        run: |
          echo "Checking for dockle-report.json..."
          if [ ! -f "dockle-report.json" ]; then
            echo "FAIL: expected dockle-report.json to exist"
            exit 1
          fi
          echo "PASS: dockle-report.json exists"
