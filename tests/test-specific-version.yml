name: Test specific dockle version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pull hello-world image
        run: docker pull hello-world

      - id: action
        uses: .
        with:
          image: hello-world
          dockle-version: "0.4.14"
          exit-code: "0"
          failure-threshold: FATAL
          report-format: json
          report-name: dockle-report-versioned

      - name: Assert dockle binary is installed and correct version
        run: |
          VERSION=$(dockle --version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "actual version: $VERSION"
          if [ "$VERSION" != "0.4.14" ]; then
            echo "FAIL: expected version 0.4.14 but got $VERSION"
            exit 1
          fi
          echo "PASS: dockle version is 0.4.14"

      - name: Assert report file was created
        run: |
          if [ ! -f "dockle-report-versioned.json" ]; then
            echo "FAIL: expected dockle-report-versioned.json to exist"
            exit 1
          fi
          echo "PASS: dockle-report-versioned.json exists"
